      minLength: 1
      maxLength: 8
      example: SU080001
    suppliers_supplierStatus:
      type: string
      minLength: 1
      maxLength: 8
      example: ACTIVE
    suppliers_supplierName:
      type: string
      minLength: 1
      maxLength: 255
      example: Dog Food Intl.
    suppliers_supplierNameU:
      type: string
      minLength: 1
      maxLength: 255
