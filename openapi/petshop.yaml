    products_productNameU:
      type: string
      minLength: 1
      maxLength: 255
      example: CANNED DOG FOOD BEEF 400G
    products_groupCode:
      type: string
      minLength: 1
      maxLength: 8
      example: PECA0001
    products_supplierID:
      type: integer
      minimum: 1
      example: 12345
    #
    # inventory
    inventory_inventoryID:
      type: integer
      minimum: 1
      example: 12345
    inventory_storeID:
      type: integer
      minimum: 1
      example: 12345
