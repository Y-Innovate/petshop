      type: string
      minLength: 1
      maxLength: 8
      example: YINUSER
    createdDate:
      type: string
      minLength: 26
      maxLength: 26
      example: 2026-01-01-12.15.51.467890
    updatedBy:
      type: string
      minLength: 1
      maxLength: 8
      example: YINUSER
    updatedDate:
      type: string
      minLength: 26
      maxLength: 26
      example: 2026-01-01-12.15.51.467890
