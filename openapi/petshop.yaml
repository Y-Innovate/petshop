    summary: Manage reference tables
    get:
      summary: Retrieve reference tables
      operationId: listRefTables
      tags:
        - list
      parameters:
        - name: tableID_filter
          in: query
          description: Filter reference table ID
          required: false
          schema:
            type: string
        - name: tableID_since
          in: query
          description: Pagination reference table ID
          required: false
          schema:
            type: string
        - name: tabKey_since
          in: query
          description: Pagination reference table key
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful retrieval of reference tables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefTablesResponseListLong"
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '500':
          description: Internal server error
        default:
          description: Unexpected error
      x-LWWProcessingSteps:
        $ref: "petshop_2.yaml/paths/~1refTables/get/x-LWWProcessingSteps"
    post:
      summary: Insert new reference table entry
      operationId: newRefTableEntry
      tags:
        - insert
